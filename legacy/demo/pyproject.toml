[project]
name = "demo"
version = "0.1.0"
description = ""
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "alembic>=1.14",
    "async_storages>=0.7",
    "cryptography>=44.0",
    "gunicorn>=22",
    "itsdangerous>=2.2",
    "kupala>=0.31.0",
    "mailers[css_inline]>=3.2",
    "passlib>=1.7",
    "psycopg[pool,binary]>=3.2",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-babel>=2",
    "types-passlib>=1.7",
]

[project.entry-points."kupala.commands"]
demo = "demo.app:app.cli_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[tool.mypy]
files = ["demo", "tests"]
exclude = ["var", ".venv", ".git", "alembic"]
pretty = true
strict = true
show_error_context = true
show_column_numbers = true
show_error_codes = true
implicit_reexport = true

[tool.ruff]
line-length = 120
indent-width = 4
exclude = ["var", ".venv", ".git"]

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "F"]
exclude = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
norecursedirs = [
    "node_modules", "assets", "dist", ".git", "var",
    "*/migrations/*", "*/static/*", "docs", ".venv"
]
addopts = "--tb=short -s --no-cov-on-fail"
testpaths = ["tests"]

[tool.coverage.run]
branch = false
parallel = true
source = ["demo", "tests"]
omit = [".venv/*", ".git/*", "*/__main__.py", "examples"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
    "def __repr__",
    "if self\\.debug",
    "if 0:",
    "if False:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "var/coverage/html_report"

[tool.uv.sources]
kupala = { path = "../kupala" }
