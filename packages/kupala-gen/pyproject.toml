[project]
name = "kupala-gen"
version = "0.1.0"
description = "Code generation for Kupala applications."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "alex.oleshkevich", email = "alex.oleshkevich@gmail.com" }]
dependencies = [
  "click>=8.4",
  "copier>=9.18",
  "dulwich>=0.25",
  "kupala",
  "libcst>=1.8",
  "packaging>=26.0",
  "questionary>=2.1.1",
]

[project.entry-points."kupala.commands"]
gen = "kupala_gen.plugin:register"

[project.entry-points."kupala.generators"]
module = "kupala_gen.generators.module:generator"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
