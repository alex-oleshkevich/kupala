[project]
name = "kupala"
description = "A web framework for those who value their time."
readme = "README.md"
authors = [{ name = "alex.oleshkevich", email = "alex.oleshkevich@gmail.com" }]
requires-python = ">=3.14"
version = "0.60.0"
dependencies = [
    "starlette>=1.3",
    "anyio>=4",
    "click>=8.4",
    "httpx2>=2.10.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "starsessions>=2.2.1",
    "asgiref>=3.12.1",
]

[project.scripts]
kupala = "kupala.cli:main"

[project.optional-dependencies]
msgspec = ["msgspec>=0.19"]
pydantic = ["pydantic>=2.12"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
