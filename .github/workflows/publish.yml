name: Upload Python Package

on:
    release:
        types: [created]

jobs:
    publish_package:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write # trusted publishing

        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v6
              with:
                  python-version: "3.14"

            # `v1.2.3` releases the core package; `<member>-v1.2.3` releases that member.
            - name: Resolve package from release tag
              id: pkg
              run: |
                  tag="${GITHUB_REF_NAME}"
                  case "$tag" in
                      v*) name=kupala ;;
                      *)  name="${tag%-v*}" ;;
                  esac
                  echo "name=$name" >> "$GITHUB_OUTPUT"

            - run: uv build --package "${{ steps.pkg.outputs.name }}" --out-dir dist
            - run: uv publish
