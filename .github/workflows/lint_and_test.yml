name: Lint and test

on:
    push:
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v6
              with:
                  python-version: "3.14"
                  enable-cache: true

            - run: uv sync --all-packages --all-groups
            - run: uv run prek run --all-files

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v6
              with:
                  python-version: "3.14"
                  enable-cache: true

            - run: uv sync --all-packages --all-groups
            - run: uv run mypy
            - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=100

            - uses: codecov/codecov-action@v5
              with:
                  files: ./coverage.xml

    # The workspace shares one venv, so the test job cannot prove a package
    # installs on its own. Build each wheel and import it in isolation.
    packaging:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package: [kupala]
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v6
              with:
                  python-version: "3.14"

            - run: uv build --package ${{ matrix.package }} --out-dir dist
            - run: uv run --isolated --no-project --with dist/*.whl python -c "import ${{ matrix.package }}"
