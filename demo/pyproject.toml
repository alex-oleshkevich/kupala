[project]
name = "demo"
version = "0"
description = "Demo application exercising the framework."
requires-python = ">=3.14"
dependencies = [
  "kupala",
  "pydantic-settings>=2.15.0",
  "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project.entry-points."kupala.app"]
app = "demo.app:app"

# the demo keeps a flat layout rather than src/, and the CLI only imports what the environment can
# already import, so it has to be installed like any other project
[tool.uv.build-backend]
module-root = ""
