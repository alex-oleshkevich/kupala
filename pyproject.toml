[dependency-groups]
dev = [
  "httpx2>=2.10.0",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "uvicorn>=0.52.1",
  "zuban>=0.9.1",
]
testing = [
  "itsdangerous>=2.2",
  "mypy>=2.3",
  "prek>=0.4.5",
  "pytest-asyncio>=0.25.3",
  "pytest-cov>=7.1.0",
]

[tool.coverage.run]
branch = false
parallel = true
source_pkgs = ["kupala"]
source = ["packages/kupala/tests"]
omit = [".venv/*", ".git/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
skip_empty = true

exclude_also = [
  "raise AssertionError",
  "raise NotImplementedError",
  "def __repr__",
  "if self\\.debug",
  "if 0:",
  "if False:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "var/coverage/html_report"

[tool.mypy]
files = ["packages/", "demo/demo"]
python_version = "3.14"
pretty = true
strict = true
show_error_context = true
show_column_numbers = true
show_error_codes = true
implicit_reexport = true
warn_no_return = false
disallow_subclassing_any = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--tb=short -s --no-cov-on-fail --import-mode=importlib"
norecursedirs = [
  "node_modules",
  "assets",
  "dist",
  ".git",
  "var",
  "*/migrations/*",
  "*/static/*",
  "docs",
  ".venv",
]
testpaths = ["packages/kupala/tests"]
anyio_mode = "auto"

[tool.ruff]
# the workspace root has no [project], so ruff cannot infer this from requires-python
target-version = "py314"
line-length = 120
indent-width = 4
exclude = ["var", ".venv", ".git"]

[tool.ruff.lint]
fixable = ["ALL"]

[tool.ruff.lint.isort]
# workspace members live under packages/*/src, which ruff cannot infer as source roots
known-first-party = ["kupala", "demo"]

[tool.uv.workspace]
members = ["packages/*", "demo"]

[tool.uv.sources]
kupala = { workspace = true }
