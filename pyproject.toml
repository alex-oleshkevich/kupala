[project]
name = "kupala"
version = "0.60.0"
description = "A web framework for those who value their time."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "alex.oleshkevich", email = "alex.oleshkevich@gmail.com" }]
dependencies = [
  "asgiref>=3.12.1",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.20",
  "starlette>=1.3",
  "starsessions>=2.2.1",
]

[project.optional-dependencies]
msgspec = ["msgspec>=0.19"]
pydantic = ["pydantic>=2.12"]

[dependency-groups]
dev = [
  "click>=8.4",
  "httpx2>=2.12.0",
  "msgspec>=0.19",
  "mypy>=2.3.1",
  "pydantic>=2.12",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "uvicorn>=0.52.1",
  "zuban>=0.9.3",
]
testing = [
  "itsdangerous>=2.2",
  "mypy>=2.3",
  "prek>=0.4.5",
  "pytest-asyncio>=0.25.3",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.12.5"]
build-backend = "uv_build"

[tool.coverage.run]
branch = false
parallel = true
source = ["kupala", "tests"]
omit = [".venv/*", ".git/*", "*/__main__.py", "examples"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
skip_empty = true

exclude_also = [
  "raise AssertionError",
  "raise NotImplementedError",
  "def __repr__",
  "if self\\.debug",
  "if 0:",
  "if False:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "var/coverage/html_report"

[tool.mypy]
files = ["kupala", "tests"]
python_version = "3.14"
pretty = true
strict = true
show_error_context = true
show_column_numbers = true
show_error_codes = true
implicit_reexport = true
warn_no_return = false
disallow_subclassing_any = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--tb=short -s --no-cov-on-fail"
norecursedirs = [
  "node_modules",
  "assets",
  "dist",
  ".git",
  "var",
  "*/migrations/*",
  "*/static/*",
  "docs",
  ".venv",
]
testpaths = ["tests"]
anyio_mode = "auto"

[tool.ruff]
line-length = 120
indent-width = 4
exclude = ["var", ".venv", ".git"]

[tool.ruff.lint]
fixable = ["ALL"]

[tool.uv.build-backend]
module-root = ""
