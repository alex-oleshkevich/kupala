[project]
name = "kupala"
description = "A web framework for those who value their time."
readme = "README.md"
authors = [{ name = "alex.oleshkevich", email = "alex.oleshkevich@gmail.com" }]
requires-python = ">=3.14"
version = "0.60.0"
dependencies = [
    "starlette>=1.3",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "starsessions>=2.2.1",
    "asgiref>=3.12.1",
]

[build-system]
requires = ["uv_build>=0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "click>=8.4",
    "httpx2>=2.10.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "uvicorn>=0.52.1",
    "zuban>=0.9.1",
]
testing = [
    "itsdangerous>=2.2",
    "mypy>=2.3",
    "prek>=0.4.5",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=7.1.0",
]

[tool.mypy]
files = ["kupala", "tests"]
pretty = true
strict = true
show_error_context = true
show_column_numbers = true
show_error_codes = true
implicit_reexport = true
warn_no_return = false
disallow_subclassing_any = false
ignore_missing_imports = true

[tool.ruff]
line-length = 120
indent-width = 4
exclude = ['var', '.venv', '.git']

[tool.ruff.lint]
fixable = ["ALL"]

[tool.pytest.ini_options]
anyio_mode = 'auto'
norecursedirs = [
    "node_modules",
    "assets",
    "dist",
    ".git",
    "var",
    "*/migrations/*",
    "*/static/*",
    "docs",
    ".venv",
]
addopts = "--tb=short -s --no-cov-on-fail"
testpaths = ["tests"]

[tool.coverage.run]
branch = false
parallel = true
source = ["kupala", "tests"]
omit = [".venv/*", ".git/*", "*/__main__.py", "examples"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
skip_empty = true

exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
    "def __repr__",
    "if self\\.debug",
    "if 0:",
    "if False:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "var/coverage/html_report"
